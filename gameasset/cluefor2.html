<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LENS — Round 2</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:#090b0f;color:#f3f3f3;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}
.card{width:min(700px,92vw);padding:34px 24px;background:#12151a;border:1px solid #30343a;border-radius:20px}
.kicker{font-size:12px;letter-spacing:3px;color:#89929e}.title{font-size:58px;letter-spacing:9px;margin:8px 0}
p{color:#b9c0c9;line-height:1.6}.box{background:#090b0f;border:1px solid #2a3038;border-radius:14px;padding:18px;margin:22px 0}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#f3f3f3;color:#090b0f}.secondary{background:#252a31;color:#fff}
#source{display:none;margin-top:18px;background:#050608;border:1px solid #2a3038;border-radius:12px;padding:16px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c9d0d8}
.small{font-size:12px;color:#747e89}
</style>
</head>
<body>
<main class="card">
<div class="kicker">DRUSHYAM • ROUND 2</div>
<div class="title">LENS</div>
<p>The picture is only the surface.</p>
<div class="box">
<strong>Something is hidden where the image keeps its secrets.</strong>
<p class="small">Download the vector image. Then decide how you should inspect it.</p>
<button class="primary" id="download">DOWNLOAD VECTOR IMAGE</button>
<button class="secondary" id="inspect">INSPECT THE SVG</button>
<pre id="source"></pre>
</div>
<p class="small">The clue is not written in the visible picture.</p>
</main>

<script>
const svg = `<?xml version="1.0" encoding="UTF-8"?>
<!-- 4E 45 58 54 57 4F 52 44 3A 20 4D 49 52 52 4F 52 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<metadata>Look beyond the surface.</metadata>
<rect width="1200" height="700" fill="#f4f1ea"/>
<rect x="90" y="90" width="1020" height="520" rx="28" fill="#d9dde1"/>
<circle cx="600" cy="280" r="125" fill="#aab4bf"/>
<circle cx="560" cy="245" r="18" fill="#f4f1ea"/>
<path d="M450 500 Q600 400 750 500" fill="none" stroke="#69737e" stroke-width="24" stroke-linecap="round"/>
<text x="600" y="575" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#424a52" letter-spacing="8">LOOK CLOSER</text>
</svg>`;

document.getElementById('download').onclick=()=>{
 const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a'); a.href=url; a.download='lens-clue.svg';
 document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
};

document.getElementById('inspect').onclick=()=>{
 const box=document.getElementById('source');
 box.textContent=svg;
 box.style.display=box.style.display==='block'?'none':'block';
};
</script>
</body>
</html>
